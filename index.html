<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tier 1 — Alert Triage</title>
<meta name="description" content="Autonomous Tier 1 alert triage. The model classifies; deterministic code decides.">

<!-- ═══════════════════════════════════════════════════════════════════════════════════════════
     Static entry point for GitHub Pages.

     This is the console's own markup, loading the console's own stylesheet and script from
     public/ — nothing in the app is duplicated or modified. The only addition is pages-shim.js,
     which answers the API calls from a recording of the real server (see build-pages.mjs).

     Paths are relative because Pages serves this under /SOC/, where the app's absolute /styles.css
     and /app.js would resolve to the domain root and 404.
     ═══════════════════════════════════════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="public/styles.css">
<style>
  /* Fixed, so it sits over the console without disturbing its full-height layout. */
  .preview-note{
    position:fixed;left:14px;bottom:14px;z-index:999;max-width:340px;
    display:flex;gap:11px;align-items:flex-start;
    background:var(--amber-bg,#291f0d);border:1px solid var(--amber-line,#5d4718);
    border-left-width:3px;border-radius:10px;padding:12px 13px;
    box-shadow:0 24px 60px -16px rgba(0,0,0,.7);
    font:13px/1.5 var(--sans,system-ui);color:var(--amber-ink,#ffd88a);
  }
  .preview-note b{color:#ffe4ab}
  .preview-note a{color:var(--blue,#5b9cff)}
  .preview-note .pn-x{
    flex:none;margin-left:2px;background:none;border:0;cursor:pointer;
    color:var(--amber-ink,#ffd88a);opacity:.6;font-size:15px;line-height:1;padding:2px 3px
  }
  .preview-note .pn-x:hover{opacity:1}
  @media (max-width:620px){ .preview-note{display:none} }
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login" class="login">
  <div class="loginBox">
    <div class="logo">AI</div>
    <h1>AI Tier 1</h1>
    <div class="roles" id="roleCards"></div>
    <div class="foot" id="loginFoot"></div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app" hidden>
  <header class="top">
    <div class="brand"><div class="logo sm">AI</div><b>AI Tier 1</b></div>
    <nav class="nav" id="nav">
      <button data-p="dash" class="on">Dashboard</button>
      <button data-p="alerts">Alerts <b id="navCount"></b></button>
    </nav>
    <div class="topRight">
      <span class="health" id="health"><i></i><span id="healthText">Working</span></span>
      <button class="iconBtn" id="helpBtn" title="Keyboard shortcuts (press ?)">?</button>
      <button class="btn ghost" id="switchRole"><span class="who" id="roleInitial"></span><span id="roleName"></span> ▾</button>
    </div>
  </header>

  <!-- dashboard page -->
  <section class="page dash" id="pageDash"></section>

  <!-- alerts page -->
  <section class="page" id="pageAlerts" hidden>
    <div class="grid" id="grid">
      <aside class="queue" id="queuePane">
        <div class="qTools">
          <input type="search" id="q" placeholder="Search alerts, people, devices…" autocomplete="off">
          <select id="sort" title="Sort">
            <option value="new">Newest</option>
            <option value="sev">Most urgent</option>
            <option value="conf">Least sure</option>
          </select>
        </div>
        <div class="filters" id="filters"></div>
        <div id="queueList"></div>
      </aside>

      <section class="work">
        <div class="workbar">
          <button class="tgl" id="tglLeft" title="Hide the list (press [ )">‹</button>
          <span class="wbGap"></span>
          <button class="tgl" id="tglRight" title="Hide the panel (press ] )">›</button>
        </div>

        <div id="empty" class="empty"></div>

        <div id="case" hidden>
          <div class="caseHead">
            <div class="crumbs" id="crumbs"></div>
            <h1 id="caseTitle"></h1>
          </div>
          <div id="verdictCard"></div>
          <div class="steps" id="steps"></div>
          <div id="livePanel" hidden><ol class="pipe" id="pipe"></ol></div>
          <nav class="tabs" id="tabs"></nav>
          <div id="tabBody"></div>
        </div>
      </section>

      <aside class="side" id="side"></aside>
    </div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <div class="sheetTop"><h2 id="modalTitle"></h2><button class="x" id="modalClose">✕</button></div>
    <div class="sheetBody" id="modalBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<aside class="preview-note" id="previewNote">
  <div>
    <b>Static preview.</b> Verdicts and pipeline runs are replayed from a recording of the real
    server. Enrichment and the policy gate are not executing here.
    <a href="https://github.com/Ahmadani-67/SOC">Run it for real →</a>
  </div>
  <button class="pn-x" id="pnClose" title="Dismiss" aria-label="Dismiss">✕</button>
</aside>

<script src="pages-shim.js"></script>
<script type="module" src="public/app.js"></script>
<script>
  document.getElementById("pnClose").onclick = function () {
    document.getElementById("previewNote").remove();
  };
</script>
</body>
</html>
